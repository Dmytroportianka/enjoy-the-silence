<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory status</title>
<style>
:root { --bg:#10130f; --panel:#181c16; --line:#2e332a; --fg:#e6e8df; --dim:#9aa08f; --ok:#8fce6e; --bad:#e07a5f; --accent:#d9a441; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; padding:20px; max-width:1100px; }
h1 { font-size:20px; margin:0 0 4px; } .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
.bad { color:var(--bad); } .ok { color:var(--ok); }
nav { display:flex; gap:8px; margin-bottom:16px; }
nav button { background:none; border:1px solid var(--line); color:var(--dim); padding:6px 14px; cursor:pointer; font:inherit; font-size:13px; }
nav button[aria-selected="true"] { color:var(--fg); border-color:var(--accent); }
section { display:none; } section.on { display:block; }
table { border-collapse:collapse; width:100%; font-size:13px; margin-bottom:20px; }
th, td { text-align:left; border-bottom:1px solid var(--line); padding:6px 8px; vertical-align:top; }
th { color:var(--dim); font-weight:normal; }
.vitals { display:flex; flex-wrap:wrap; gap:24px; font-size:13px; margin-bottom:20px; } .vitals b { display:block; font-size:16px; }
#term-out { background:#0a0c09; border:1px solid var(--line); padding:12px; height:320px; overflow:auto; white-space:pre-wrap; font-size:12px; }
#term-form { display:flex; gap:8px; margin-top:8px; }
#term-input { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--fg); padding:8px; font:inherit; }
#term-form button { background:var(--panel); border:1px solid var(--accent); color:var(--fg); padding:8px 16px; cursor:pointer; font:inherit; }
.hint { color:var(--dim); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<h1>Factory status <span id="banner"></span></h1>
<div class="sub" id="meta">loading…</div>
<nav>
  <button data-tab="overview" aria-selected="true">Overview</button>
  <button data-tab="sessions" aria-selected="false">Muse sessions</button>
  <button data-tab="terminal" aria-selected="false">Terminal</button>
</nav>

<section id="tab-overview" class="on">
  <div class="vitals" id="vitals"></div>
  <table><thead><tr><th>Unit</th><th>State</th><th>Memory</th><th>Last log</th></tr></thead><tbody id="units"></tbody></table>
  <table><thead><tr><th>Binary</th><th>Path</th></tr></thead><tbody id="binaries"></tbody></table>
  <table><thead><tr><th>Listen</th><th>Process</th></tr></thead><tbody id="ports"></tbody></table>
</section>

<section id="tab-sessions">
  <table><thead><tr><th>PID</th><th>Elapsed</th><th>Session</th><th>Command</th></tr></thead><tbody id="sessions"></tbody></table>
  <table><thead><tr><th>Job</th><th>Station</th><th>Role</th><th>Session id</th><th>Delivered</th></tr></thead><tbody id="stations"></tbody></table>
</section>

<section id="tab-terminal">
  <div id="term-out"></div>
  <form id="term-form"><input id="term-input" placeholder="command, e.g. ls enjoy-the-silence-generated && cat enjoy-the-silence-generated/README.md" autocomplete="off"><button type="submit">Run</button></form>
  <div class="hint">Runs inside this VM (30s limit). Requires basic auth when STATUS_AUTH_PASS_HASH is set; disabled on a non-loopback bind without one.</div>
</section>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach((x) => x.setAttribute("aria-selected", x === b ? "true" : "false"));
  document.querySelectorAll("section").forEach((s) => s.classList.toggle("on", s.id === "tab-" + b.dataset.tab));
}));
async function tick() {
  const st = await (await fetch("/state")).json();
  $("banner").textContent = st.ok ? "· all green" : "· failures";
  $("banner").className = st.ok ? "ok" : "bad";
  $("meta").textContent = st.host.label + " · " + st.vitals.osName + " " + st.vitals.kernel + " · " + st.now;
  const v = st.vitals;
  $("vitals").innerHTML = [["uptime", Math.floor(v.uptime / 3600) + "h"], ["load", v.load.map((n) => n.toFixed(2)).join(" / ")], ["memory", (v.memUsed / 1e9).toFixed(1) + " / " + (v.memTotal / 1e9).toFixed(1) + " GB"], ["disk /", v.disk.used + " / " + v.disk.total + " (" + v.disk.pct + ")"]].map(([k, x]) => "<div>" + esc(k) + "<b>" + esc(x) + "</b></div>").join("");
  $("units").innerHTML = st.units.map((u) => "<tr><td>" + esc(u.id) + "</td><td class=\"" + (u.activeState === "active" ? "ok" : "bad") + "\">" + esc(u.activeState + "/" + u.subState) + "</td><td>" + (u.memoryMb ? u.memoryMb.toFixed(0) + " MB" : "—") + "</td><td>" + esc((u.journal || []).join(" · ")) + "</td></tr>").join("") || "<tr><td colspan=4>no units matched</td></tr>";
  $("binaries").innerHTML = Object.entries(st.binaries).map(([k, p]) => "<tr><td>" + esc(k) + "</td><td class=\"" + (p ? "ok" : "bad") + "\">" + esc(p || "missing") + "</td></tr>").join("");
  $("ports").innerHTML = st.ports.map((p) => "<tr><td>" + esc(p.local) + "</td><td>" + esc(p.process) + "</td></tr>").join("");
  $("sessions").innerHTML = st.sessions.map((s) => "<tr><td>" + s.pid + "</td><td>" + esc(s.etime) + "</td><td>" + esc(s.sessionId || "(new)") + "</td><td>" + esc(s.command) + "</td></tr>").join("") || "<tr><td colspan=4>no muse sessions running</td></tr>";
  $("stations").innerHTML = st.stations.map((s) => "<tr><td>" + esc(s.jobId) + "</td><td>" + esc(s.stationId) + "</td><td>" + esc(s.role) + "</td><td>" + esc(s.sessionId || "—") + "</td><td>" + (s.delivered ? "yes" : "pending") + "</td></tr>").join("") || "<tr><td colspan=5>no job cards yet</td></tr>";
}
tick(); setInterval(tick, 5000);
$("term-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const cmd = $("term-input").value; if (!cmd.trim()) return;
  $("term-out").textContent += "$ " + cmd + "\n";
  const res = await fetch("/api/terminal/exec", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ command: cmd }) });
  const data = await res.json().catch(() => ({ output: "HTTP " + res.status }));
  $("term-out").textContent += (data.output ?? data.error ?? "") + "\n[exit " + (data.code ?? res.status) + "]\n";
  $("term-out").scrollTop = $("term-out").scrollHeight;
  $("term-input").value = "";
});
</script>
</body>
</html>
